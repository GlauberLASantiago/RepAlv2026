<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coral Alvorada - Repertório</title>
    <!-- Tailwind CSS para estilização -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React e ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel para processar JSX no navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-emerald-950">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Componentes de Ícones simples em SVG (Substituindo Lucide para compatibilidade HTML único)
        const IconMusic = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>;
        const IconCalendar = () => <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>;
        const IconInfo = () => <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>;
        const IconCopy = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>;
        const IconCheck = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>;
        const IconAlert = () => <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>;
        const IconLoader = () => <svg class="animate-spin" xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg>;

        const App = () => {
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [repertorioData, setRepertorioData] = useState(null);
            const [copyStatus, setCopyStatus] = useState(false);

            const SHEET_ID = '14N3k3ZOUnL9QLWP3j2Qrns1G2W7u0JV4';
            const GVIZ_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

            useEffect(() => {
                fetchData();
            }, []);

            const fetchData = async () => {
                try {
                    setLoading(true);
                    const response = await fetch(GVIZ_URL);
                    const text = await response.text();
                    const jsonData = JSON.parse(text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1));
                    const rows = jsonData.table.rows;
                    
                    if (!rows || rows.length === 0) throw new Error("Nenhum dado encontrado.");

                    const now = new Date();
                    now.setHours(0, 0, 0, 0);

                    let targetDate = null;
                    let entries = [];

                    for (let row of rows) {
                        const cellA = row.c[0];
                        if (cellA && cellA.v) {
                            const dateVal = parseGoogleDate(cellA.v);
                            if (dateVal && dateVal.getTime() >= now.getTime()) {
                                targetDate = dateVal;
                                break; 
                            }
                        }
                    }

                    if (!targetDate) {
                        for (let i = rows.length - 1; i >= 0; i--) {
                            const cellA = rows[i].c[0];
                            if (cellA && cellA.v) {
                                targetDate = parseGoogleDate(cellA.v);
                                if (targetDate) break;
                            }
                        }
                    }

                    if (targetDate) {
                        const targetDateString = targetDate.toDateString();
                        rows.forEach(row => {
                            const cellA = row.c[0];
                            const cellB = row.c[1]; 
                            const cellC = row.c[2]; 
                            if (cellA && cellA.v) {
                                const dateVal = parseGoogleDate(cellA.v);
                                if (dateVal && dateVal.toDateString() === targetDateString) {
                                    entries.push({
                                        label: cellB ? cellB.v : "Evento",
                                        content: cellC ? cellC.v : "Repertório não informado"
                                    });
                                }
                            }
                        });

                        setRepertorioData({
                            date: targetDate,
                            formattedDate: formatDate(targetDate),
                            entries: entries,
                            isToday: targetDate.getTime() === now.getTime(),
                            isPast: targetDate.getTime() < now.getTime()
                        });
                    }
                } catch (err) {
                    setError("Erro ao carregar os dados da planilha pública.");
                } finally {
                    setLoading(false);
                }
            };

            const parseGoogleDate = (value) => {
                if (typeof value === 'string' && value.startsWith('Date')) {
                    const parts = value.match(/\d+/g);
                    return new Date(parts[0], parts[1], parts[2]);
                }
                const d = new Date(value);
                if (!isNaN(d.getTime())) { d.setHours(0, 0, 0, 0); return d; }
                return null;
            };

            const formatDate = (date) => {
                const d = date.getDate().toString().padStart(2, '0');
                const m = (date.getMonth() + 1).toString().padStart(2, '0');
                const y = date.getFullYear().toString().slice(-2);
                return `${d}/${m}/${y}`;
            };

            const copyToClipboard = () => {
                if (!repertorioData) return;
                let textToCopy = `🎶 *Coral Alvorada*\nRepertório para o dia ${repertorioData.formattedDate}\n`;
                repertorioData.entries.forEach(entry => {
                    textToCopy += `\n*${entry.label}*\n${entry.content}\n`;
                });
                
                const textArea = document.createElement("textarea");
                textArea.value = textToCopy.trim();
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    setCopyStatus(true);
                    setTimeout(() => setCopyStatus(false), 3000);
                } catch (err) {}
                document.body.removeChild(textArea);
            };

            return (
                <div className="min-h-screen bg-emerald-950 flex items-center justify-center p-4">
                    <div className="max-w-lg w-full bg-white rounded-3xl shadow-2xl overflow-hidden border border-emerald-900/20">
                        <div className="bg-emerald-800 p-6 text-white text-center relative">
                            <h1 className="text-3xl font-black tracking-tight mb-1">Coral Alvorada</h1>
                            <div className="flex items-center justify-center gap-2 text-emerald-100/80 text-sm">
                                <IconMusic />
                                <span>Repertório Atualizado</span>
                            </div>
                        </div>

                        <div className="p-6">
                            {loading ? (
                                <div className="flex flex-col items-center justify-center py-16 text-slate-400">
                                    <IconLoader />
                                    <p className="mt-4 font-medium text-emerald-800">Verificando agenda...</p>
                                </div>
                            ) : error ? (
                                <div className="bg-red-50 border border-red-100 rounded-2xl p-6 text-center">
                                    <IconAlert />
                                    <p className="text-red-700 font-medium mt-2">{error}</p>
                                    <button onClick={fetchData} className="mt-4 px-6 py-2 bg-red-600 text-white rounded-xl">Tentar novamente</button>
                                </div>
                            ) : repertorioData ? (
                                <div className="space-y-6">
                                    <div className={`flex items-center justify-between p-4 rounded-2xl border transition-all ${repertorioData.isToday ? 'bg-emerald-600 text-white border-emerald-400 shadow-md' : 'bg-emerald-50 border-emerald-100'}`}>
                                        <div className="flex items-center gap-3">
                                            <div className={`${repertorioData.isToday ? 'bg-white text-emerald-700' : 'bg-emerald-700 text-white'} p-2.5 rounded-xl`}>
                                                <IconCalendar />
                                            </div>
                                            <div>
                                                <p className={`text-[10px] font-bold uppercase tracking-widest ${repertorioData.isToday ? 'text-emerald-100' : 'text-emerald-700'}`}>
                                                    {repertorioData.isToday ? 'Programação de Hoje' : 'Próxima Programação'}
                                                </p>
                                                <p className={`text-2xl font-black leading-none mt-1 ${repertorioData.isToday ? 'text-white' : 'text-emerald-900'}`}>
                                                    {repertorioData.formattedDate}
                                                </p>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="space-y-4">
                                        {repertorioData.entries.map((entry, idx) => (
                                            <div key={idx} className="bg-slate-50 rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
                                                <div className="bg-emerald-100/40 px-4 py-2 flex items-center gap-2 border-b border-slate-200">
                                                    <IconInfo />
                                                    <span className="text-xs font-black text-emerald-800 uppercase tracking-tight">{entry.label}</span>
                                                </div>
                                                <div className="p-4 text-slate-700 whitespace-pre-wrap leading-relaxed text-sm font-medium">{entry.content}</div>
                                            </div>
                                        ))}
                                    </div>

                                    <div className="pt-2">
                                        <button onClick={copyToClipboard} className={`w-full py-5 rounded-2xl font-bold flex items-center justify-center gap-3 transition-all shadow-lg active:scale-95 ${copyStatus ? 'bg-emerald-600 text-white' : 'bg-blue-600 text-white shadow-blue-200 hover:bg-blue-700'}`}>
                                            {copyStatus ? <><IconCheck /><span className="text-lg">Texto Copiado!</span></> : <><IconCopy /><span className="text-lg">Copiar Repertório</span></>}
                                        </button>
                                        <div className="mt-8 text-center px-4">
                                            <p className="text-slate-500 italic text-sm">"Do Senhor é a salvação e sobre o teu povo a tua bênção"</p>
                                            <p className="text-slate-400 font-bold text-xs mt-1 uppercase tracking-widest">Salmos 3.8</p>
                                        </div>
                                    </div>
                                </div>
                            ) : null}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
